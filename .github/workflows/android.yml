name: Сборка APK
# Собирается сам после изменения кода приложения или вручную: Actions → «Сборка APK» → Run workflow.
# Готовый APK появляется в Releases; приложение на ТВ само предложит обновиться.
# Изменения в remote/config.json сборку не запускают — приложение подхватывает их само.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'

concurrency:
  group: apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Ключ подписи (из секретов репозитория)
        env:
          KS: ${{ secrets.FSK_KEYSTORE_BASE64 }}
          PW: ${{ secrets.FSK_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/fsk.p12"
            ALIAS=$(keytool -list -keystore "$RUNNER_TEMP/fsk.p12" -storetype PKCS12 -storepass "$PW" | grep -i PrivateKeyEntry | head -1 | cut -d, -f1)
            echo "FSK_KEYSTORE=$RUNNER_TEMP/fsk.p12" >> $GITHUB_ENV
            echo "FSK_KEY_ALIAS=$ALIAS" >> $GITHUB_ENV
            echo "Постоянный ключ найден"
          else
            echo "::warning::Секреты FSK_KEYSTORE_BASE64 / FSK_KEYSTORE_PASSWORD не заданы — APK подписан временным ключом"
          fi
      - name: Сборка
        env:
          FSK_KEYSTORE_PASSWORD: ${{ secrets.FSK_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          if ! gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon 2>&1 | tee build.log; then
            # Ошибки — в аннотации, чтобы их было видно без скачивания лога
            grep -E "^e: |error:|Could not|Unresolved|AAPT|FAILED|^  [A-Za-z]" build.log | grep -v "^> Task" | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - name: Публикация в Releases (только с постоянным ключом)
        if: env.FSK_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk FSK.apk
          MSG=$(git log -1 --format=%s)
          gh release create "v${{ github.run_number }}" FSK.apk \
            --title "FSK 1.${{ github.run_number }}" \
            --notes "$MSG" --latest
