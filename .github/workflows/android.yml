name: Сборка APK
# Собирается сам после изменения кода приложения или вручную: Actions → «Сборка APK» → Run workflow.
# Готовый APK появляется в Releases; приложение на ТВ само предложит обновиться.
# Изменения в remote/config.json сборку не запускают — приложение подхватывает их само.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android.yml'

concurrency:
  group: apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Ключ подписи (постоянный — чтобы обновления ставились поверх)
        env:
          KS: ${{ secrets.KINO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/kino.jks"
            echo "KINO_KEYSTORE=$RUNNER_TEMP/kino.jks" >> $GITHUB_ENV
          else
            echo "::warning::Секрет KINO_KEYSTORE_BASE64 не задан — APK будет подписан временным ключом"
          fi
      - name: Сборка
        env:
          KINO_KEYSTORE_PASSWORD: ${{ secrets.KINO_KEYSTORE_PASSWORD }}
          KINO_KEY_ALIAS: kino
        run: |
          set -o pipefail
          if ! gradle assembleRelease -PversionCode=${{ github.run_number }} --no-daemon 2>&1 | tee build.log; then
            # Ошибки — в аннотации, чтобы их было видно без скачивания лога
            grep -E "^e: |error:|Could not|Unresolved|AAPT|FAILED|^  [A-Za-z]" build.log | grep -v "^> Task" | head -25 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
      - name: Публикация в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk KinoTV.apk
          MSG=$(git log -1 --format=%s)
          gh release create "v${{ github.run_number }}" KinoTV.apk \
            --title "Кино ТВ 1.${{ github.run_number }}" \
            --notes "$MSG" --latest
